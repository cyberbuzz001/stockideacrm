services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-core-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge
